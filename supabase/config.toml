# Supabase CLI configuration for local ClinicFlow development.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "clinicflow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/login",
  "http://localhost:5173/reset-password",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your ClinicFlow account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your ClinicFlow password"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false

# Cron/email functions authenticate the caller themselves with the service
# role key, so the gateway JWT check is disabled for the two scheduled jobs.
[functions.send-reminders]
verify_jwt = false

[functions.send-low-stock-alert]
verify_jwt = false

# Called by the signed-in browser right after booking.
[functions.send-booking-confirmation]
verify_jwt = true
